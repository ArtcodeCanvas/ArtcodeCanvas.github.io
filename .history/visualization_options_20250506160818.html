<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>可视化选项</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="query-content">
        <h2>可视化选项</h2>
        <div class="option-row">
            <label class="option-label">显示序号</label>
            <label class="switch">
                <input type="checkbox" id="toggle-ids">
                <div class="slider round"></div>
            </label>
        </div>
    
        <div class="option-row">
            <label class="option-label">配色方案</label>
            <div class="palette-container">
                <div class="palette" data-colors='["#FF6B6B", "#FFD93D", "#6BCB77", "#4D96FF", "#9D4EDD", "#FF9F1C"]'></div>
                <div class="palette" data-colors='["#264653", "#2A9D8F", "#E9C46A", "#F4A261", "#E76F51", "#B5838D"]'></div>
                <div class="palette" data-colors='["#8ECAE6", "#219EBC", "#023047", "#FFB703", "#FB8500", "#F94144"]'></div>
            </div>
        </div>
    </div>
    
    <div id="result-content"></div>
</body>
</html>
