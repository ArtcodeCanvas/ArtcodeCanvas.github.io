<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>可视化选项</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="query-content">
        <h2>可视化选项</h2>

        <!-- 显示节点 ID 开关 -->
        <div class="option-row">
            <label class="option-label">显示序号</label>
            <label class="switch">
                <input type="checkbox" id="toggle-ids">
                <div class="slider round"></div>
            </label>
        </div>

        <!-- 配色方案（由 JS 动态填充） -->
        <div class="option-row">
            <label class="option-label">配色方案</label>
            <div class="palette-list">
                <!-- JavaScript 动态插入 -->
            </div>
        </div>

        <!-- 自动染色按钮 -->
        <button id="auto-color-button" class="btn">自动分组染色</button>
    </div>

    <div id="result-content"></div>
</body>
</html>
