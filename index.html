<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetVise - 简易的社交网络可视化系统</title>
  <link rel="icon" href="resources/logo1.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.22.0/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-cose-bilkent@4.0.0/cytoscape-cose-bilkent.min.js"></script>
</head>
<body>
  <div id="main-container">
    <section id="visualization" aria-label="网络关系图">
      <div class="brand-bar">
        <img src="resources/logo1.png" alt="NetVise" />
        <div>
          <h1>NetVise</h1>
          <p>社交网络分析与人物关系可视化</p>
        </div>
      </div>
      <div id="cy"></div>
      <div id="upload-section">
        <label for="fileInput" class="file-button">导入 JSON</label>
        <input type="file" id="fileInput" accept=".json" />
      </div>
    </section>

    <div id="divider" aria-hidden="true"></div>

    <aside id="controls">
      <nav id="menu-bar" aria-label="功能菜单">
        <button class="menu-item" id="inform" type="button">概览</button>
        <button class="menu-item" id="widest-path" type="button">扩散模拟</button>
        <button class="menu-item" id="key-person" type="button">关键人物</button>
        <button class="menu-item" id="visualization-options" type="button">可视化</button>
        <button class="menu-item" id="data-management" type="button">数据管理</button>
      </nav>

      <section id="query-section">
        <h2>功能介绍</h2>
        <ul class="feature-list">
          <li><b>信息扩散模拟：</b>基于 IC 模型模拟从指定人物开始的信息传播过程。</li>
          <li><b>关键人物识别：</b>支持度中心性、介数中心性和割点分析。</li>
          <li><b>人物关系可视化：</b>以节点和带权关系边展示社交网络结构。</li>
          <li><b>AI 辅助建图：</b>输入小说名称后自动抽取主要人物和关系 JSON。</li>
          <li><b>数据管理：</b>支持 CSV 转 JSON、结果下载和一键应用到图谱。</li>
        </ul>
      </section>

      <section id="result-section">
        <h2>查询结果</h2>
        <div id="result">导入数据或选择功能后，分析结果会显示在这里。</div>
      </section>
    </aside>
  </div>

  <script src="./action.js"></script>
  <script src="./upload_data.js"></script>

  <script>
    cytoscape.use(cytoscapeCoseBilkent);

    const divider = document.getElementById('divider');
    const visualization = document.getElementById('visualization');
    const controls = document.getElementById('controls');
    const fileInput = document.getElementById('fileInput');

    const cy = cytoscape({
      container: document.getElementById('cy'),
      elements: [],
      style: [
        {
          selector: 'node',
          style: {
            'background-color': '#f6b26b',
            'label': 'data(label)',
            'width': '54px',
            'height': '54px',
            'font-size': '18px',
            'font-weight': 700,
            'color': '#172033',
            'text-outline-color': '#ffffff',
            'text-outline-width': 2,
            'text-valign': 'top',
            'text-halign': 'center',
            'text-margin-y': -10
          }
        },
        {
          selector: 'edge',
          style: {
            'width': 'mapData(weight, 1, 5, 2, 7)',
            'line-color': '#8da2b8',
            'target-arrow-shape': 'triangle',
            'target-arrow-color': '#8da2b8',
            'curve-style': 'bezier',
            'label': 'data(label)',
            'font-size': '13px',
            'color': '#334155',
            'text-background-color': '#ffffff',
            'text-background-opacity': 0.85,
            'text-background-padding': '3px',
            'text-rotation': 'autorotate',
            'text-margin-y': -4,
            'arrow-scale': 1.1
          }
        }
      ]
    });

    const graphData = { nodes: [], edges: [] };
    window.graphData = graphData;
    window.cy = cy;

    if (window.enableDragResize) {
      window.enableDragResize(divider, visualization, controls);
    }

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file && file.name.endsWith('.json')) {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const content = JSON.parse(e.target.result);
            if (window.parseAndDrawGraph) {
              window.parseAndDrawGraph(content, cy, graphData);
            }
          } catch (error) {
            alert('JSON 文件解析失败，请检查文件格式。');
            console.error(error);
          }
        };
        reader.readAsText(file);
      } else {
        alert('请上传有效的 JSON 文件。');
      }
    });

    document.getElementById('inform').addEventListener('click', () => {
      loadSection('functions/inform.html', 'query-section', 'result-section');
    });
    document.getElementById('widest-path').addEventListener('click', () => {
      loadSection('functions/widest_path.html', 'query-section', 'result-section');
    });
    document.getElementById('key-person').addEventListener('click', () => {
      loadSection('functions/key_person.html', 'query-section', 'result-section');
    });
    document.getElementById('visualization-options').addEventListener('click', () => {
      loadSection('visualization_options.html', 'query-section', 'result-section');
    });
    document.getElementById('data-management').addEventListener('click', () => {
      loadSection('functions/data_management.html', 'query-section', 'result-section');
    });
  </script>
</body>
</html>
